packages:
  - .

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true

# Versions published within the last 24h trip pnpm's minimumReleaseAge policy in
# any build that runs before they age out. These are exact pins, so each entry
# is a no-op once the version is older than the cutoff.
minimumReleaseAgeExclude:
  - fastify@5.12.5

overrides:
  # fastify: pinned by @nestjs/platform-fastify@11.2.7 at vulnerable 5.12.4; fixes GHSA-4mh8-r7rc-xpvc (moderate)
  fastify: 5.12.5
  # @prisma/config pins exact deepmerge-ts 7.1.5; fixes GHSA-ggr8-5vv4-36mx (high); scoped to the only parent
  '@prisma/config>deepmerge-ts': 8.0.2
  # @nestjs/swagger wants js-yaml 5.x (GHSA-r3ph-w7gj-g6xm, moderate); 5.4.x resolves cleanly alone
  'js-yaml@5': 5.4.3
